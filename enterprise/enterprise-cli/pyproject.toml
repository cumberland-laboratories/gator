[project]
name = "gator-enterprise-cli"
version = "0.1.0"
description = "Operator CLI for Gator Enterprise"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "cryptography>=42.0",
]

[project.scripts]
gator-enterprise = "gator_enterprise_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
gator_enterprise_cli = ["bundled_scripts/*.py"]
