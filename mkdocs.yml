site_name: Gator
site_description: AI-assisted engineering governance — local-first, git-native, model-neutral.
site_url: https://cumberland-laboratories.github.io/gator/
repo_url: https://github.com/cumberland-laboratories/gator
repo_name: cumberland-laboratories/gator

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  # Home + Getting Started + Audiences sections were vaulted 2026-08-02
  # (see `.gator/vault/docs-not-ready/`) because their content described
  # the pre-monorepo `gator-engine/`-shape install/upgrade flow that no
  # longer exists. The pipx-first flow is documented in how-to-use-gator.md
  # and how-gator-works.md. Rebuild these sections against the current
  # monorepo reality as a post-2.5.2 follow-on.
  - Home: how-gator-works.md
  - How-to guides:
    - How to Use Gator: how-to-use-gator.md
    - Custom Skills & Team Workflow: custom-skills-and-team-workflow.md
    - Refactor with Gator: refactor-with-gator.md
  - Concepts:
    # How Gator Works appears as Home above; not duplicated here.
    - Governance Model: governance-model.md
    - Threat Model: threat-model.md
    - Architecture: architecture.md
    - What is Navigation Coding: what-is-navigation-coding.md
    - Why Navigation Coding Feels Different: why-navigation-coding-feels-different.md
    - Enforcer Patterns: enforcer-patterns.md
    - Origin Story: origin-story.md
    - Supporting Research: supporting-research.md
  - Reference:
    - Command Reference: command-reference.md
    - Charter Schema v1: charter-schema-v1.md
    - Charter Formation Process: charter-formation-process.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables

## Versioned docs via mike — enable when publishing pipeline is built
# extra:
#   version:
#     provider: mike
