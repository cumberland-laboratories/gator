[pytest]
# Keep collection inside tests/ and contracts/ — cache/temp paths that can be
# inaccessible in restricted Windows environments are excluded.
# contracts/compatibility uses pytest.importorskip("jsonschema"), so it
# degrades cleanly when jsonschema is not installed.
addopts = -p no:cacheprovider
testpaths = tests contracts/compatibility
norecursedirs = tmp .pytest_tmp .pytest_cache
tmp_path_retention_policy = none
markers =
    slow: real-subprocess smoke tests with wall-clock waits (v2.13.0 dashboard-ui harness)
